# QLoRA fine-tune config for RTX 3050 6GB (short proof-of-pipeline run).
# Used in the 2026-08-18 session (see PROGRESS_finetune_rtx3050.md).
policy:
  type: pi05
  pretrained_path: lerobot/pi05_base
  push_to_hub: false
  dtype: bfloat16
  device: cuda
  state_cond: true
  gradient_checkpointing: true
dataset:
  repo_id: lerobot/libero_spatial_image
output_dir: /mnt/d/vlash_train/pi05_rtx3050_test
job_name: pi05_rtx3050_test
batch_size: 1
grad_accum_steps: 1
steps: 20
num_workers: 0
seed: 1000
use_policy_training_preset: false
optimizer:
  type: adamw
  lr: 5.0e-5
  betas: [0.9, 0.95]
  weight_decay: 1.0e-10
scheduler:
  type: cosine_decay_with_warmup
  num_warmup_steps: 5
  peak_lr: 5.0e-5
  decay_lr: 2.5e-6
  num_decay_steps: 20
save_checkpoint: false
log_freq: 1
wandb:
  enable: false
max_delay_steps: 4
shared_observation: false
use_state_ground_truth: true
lora:
  enable: true
  backend: peft
  r: 16
  alpha: 16
  dropout: 0
  use_qlora: true
  qlora_quant_type: nf4
  qlora_compute_dtype: bfloat16
  extra_trainable_modules:
    - action_in_proj
    - action_out_proj
    - time_mlp_in
    - time_mlp_out
    - state_proj
    - state_mlp_in
    - state_mlp_out
    - embeddings
    - input_layernorm
    - post_attention_layernorm
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
    - out_proj
    - fc1
    - fc2
